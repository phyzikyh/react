<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>검색어에 맞는 게시물만 표시하기</title>
    <style>
      body { margin: 0; padding: 14px; background: #fafafa; color: #262626; font-family: Arial, sans-serif; }
      main { max-width: 460px; margin: 0 auto; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 9px 11px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; }
      .post-card { margin: 10px 0; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; background: white; }
      h1 { font-size: 20px; }
      h2, p { margin: 4px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script type="text/babel">
      const { useState } = React;

      const posts = [
        { id: "p1", username: "minjun_dev", caption: "오늘은 React를 공부했습니다." },
        { id: "p2", username: "coding_kim", caption: "배열 데이터를 화면에 표시합니다." },
        { id: "p3", username: "web_lee", caption: "React 프로젝트를 완성했습니다." },
      ];

      function PostCard({ post }) {
        return (
          <article className="post-card">
            <h2>{post.username}</h2>
            <p>{post.caption}</p>
          </article>
        );
      }

      function App() {
        const [query, setQuery] = useState("");
        const normalizedQuery = query.trim().toLowerCase();
        const visiblePosts = posts.filter((post) =>
          post.caption.toLowerCase().includes(normalizedQuery)
        );

        return (
          <main>
            <h1>게시물 검색</h1>
            <label htmlFor="post-search">검색어</label>
            <input
              id="post-search"
              type="search"
              value={query}
              onChange={(event) => setQuery(event.target.value)}
              placeholder="예: React"
            />

            <p role="status">검색 결과 {visiblePosts.length}개</p>
            {visiblePosts.length === 0 ? (
              <p>검색 결과가 없습니다.</p>
            ) : (
              <section>
                {visiblePosts.map((post) => (
                  <PostCard key={post.id} post={post} />
                ))}
              </section>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
