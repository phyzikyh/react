<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>State를 부모로 올린 검색</title>
<style>
  body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#262626;}
  h1{font-size:18px;margin:0 0 10px;}
  input{width:min(320px,90%);font-size:14px;padding:8px 10px;border:1px solid #cfd4da;border-radius:8px;}
  ul{list-style:none;padding:0;margin:12px 0 0;max-width:420px;}
  li{padding:10px 12px;margin-bottom:8px;border:1px solid #e1e4e8;border-radius:8px;font-size:14px;}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

const posts = [
  { id: "p1", username: "minjun_dev", caption: "오늘은 React를 공부했습니다." },
  { id: "p2", username: "coding_kim", caption: "배열 데이터를 화면에 표시합니다." },
  { id: "p3", username: "web_lee", caption: "React 프로젝트를 완성했습니다." },
];

function SearchBar({ query, onQueryChange }) {
  return (
    <input
      value={query}
      onChange={(event) => onQueryChange(event.target.value)}
      placeholder="게시물 검색"
    />
  );
}

function PostList({ query }) {
  const visiblePosts = posts.filter((post) =>
    post.caption.toLowerCase().includes(query.trim().toLowerCase())
  );

  return (
    <ul>
      {visiblePosts.map((post) => (
        <li key={post.id}>
          <strong>{post.username}</strong> {post.caption}
        </li>
      ))}
    </ul>
  );
}

function App() {
  const [query, setQuery] = useState("");

  return (
    <main>
      <h1>게시물 검색</h1>
      <SearchBar query={query} onQueryChange={setQuery} />
      <PostList query={query} />
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
