<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>사용자 정의 Hook</title>
<style>
  body { margin:0; padding:16px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; }
  button { display:block; margin:6px 0; font-size:14px; padding:8px 14px; border:1px solid #cfd4da; border-radius:8px; background:#fff; cursor:pointer; }
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function useToggle(initialValue = false) {
  const [isOpen, setIsOpen] = useState(initialValue);
  const toggle = () => setIsOpen((open) => !open);
  return [isOpen, toggle];
}
function App() {
  const [isBioOpen, toggleBio] = useToggle(false);
  const [isMenuOpen, toggleMenu] = useToggle(false);
  return (
    <div>
      <button onClick={toggleBio}>자기소개 {isBioOpen ? "닫기" : "열기"}</button>
      <button onClick={toggleMenu}>메뉴 {isMenuOpen ? "닫기" : "열기"}</button>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
