project:
  type: book
  output-dir: _book
  resources:
    - examples/**

book:
  title: "고급웹프로그래밍:React"
  subtitle: "2026학년도 2학기"
  author: "신기홍"
  search: true
  page-footer:
    left: "고급웹프로그래밍:React"
    right: "© 2026 신기홍"
  chapters:
    - index.qmd
    - part: "1주차 · HTML 기초"
      chapters: [week01_lecture.qmd, week01_quiz.qmd, week01_code.qmd]
    - part: "2주차 · CSS 기초와 반응형 웹"
      chapters: [week02_lecture.qmd, week02_quiz.qmd, week02_code.qmd]
    - part: "3주차 · JSX와 엘리먼트 렌더링"
      chapters: [week03_lecture.qmd, week03_quiz.qmd, week03_code.qmd]
    - part: "4주차 · 컴포넌트와 Props"
      chapters: [week04_lecture.qmd, week04_quiz.qmd, week04_code.qmd]
    - part: "5주차 · State와 이벤트 처리"
      chapters: [week05_lecture.qmd, week05_code.qmd]
    - part: "6주차 · React Hook 기초"
      chapters: [week06_lecture.qmd, week06_code.qmd]
    - part: "7주차 · 조건부 렌더링과 리스트"
      chapters: [week07_lecture.qmd, week07_code.qmd]

crossref:
  fig-title: "그림"
  tbl-title: "표"
  fig-prefix: "그림"
  tbl-prefix: "표"
  eq-prefix: "식"
  sec-prefix: "절"
  title-delim: "."

lang: ko

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    lang: ko
    toc: true
    toc-title: "목차"
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    fig-cap-location: bottom
    tbl-cap-location: top
    fig-align: center
    fig-format: png
    html-math-method: mathjax
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
    include-after-body: interactive.html
    mermaid:
      theme: neutral

execute:
  freeze: auto
  warning: false
  echo: false
