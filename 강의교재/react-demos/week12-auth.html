<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>예제 12-3</title>
<style>
body { margin: 0; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; color: #1f2937; background: #f8fafc; }
.screen { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
.page { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
.app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 12px 18px; border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
.user-menu { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.avatar { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #2563eb); color: #fff; font-size: 14px; font-weight: 600; }
.card { margin-bottom: 12px; padding: 16px 18px; border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
.card h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: #111827; }
.card-body { font-size: 14px; line-height: 1.6; color: #6b7280; }
.card-body p { margin: 0 0 4px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
.row:last-of-type { border-bottom: none; }
.btn { padding: 8px 16px; border: 1px solid transparent; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-danger { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
.btn-danger:hover { background: #fee2e2; }
.btn-outline { background: #fff; color: #2563eb; border-color: #bfdbfe; }
.btn-outline:hover { background: #eff6ff; }
.btn-small { padding: 5px 12px; font-size: 12px; }
.badge { padding: 3px 10px; border-radius: 999px; background: #eff6ff; color: #2563eb; font-size: 12px; font-weight: 600; }
.stamp { font-size: 13px; font-variant-numeric: tabular-nums; color: #6b7280; }
.field { box-sizing: border-box; width: 100%; margin-bottom: 8px; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
.check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; }
.place { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; padding: 12px 18px; border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05); }
.place p { margin: 0; font-size: 14px; line-height: 1.5; color: #6b7280; }
.place b { display: block; color: #111827; }
.thumb { flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: linear-gradient(135deg, #93c5fd, #2563eb); color: #fff; font-size: 18px; font-weight: 600; transition: width 0.15s, height 0.15s; }
.themed { min-height: 100vh; box-sizing: border-box; }
.theme-light { background: #f8fafc; color: #1f2937; }
.theme-dark { background: #0f172a; color: #e5e7eb; }
.theme-dark .app-header, .theme-dark .card { background: #1e293b; border-color: #334155; box-shadow: none; }
.theme-dark .card h2 { color: #f8fafc; }
.theme-dark .card-body { color: #94a3b8; }
.theme-dark .row { border-bottom-color: #334155; }
.theme-dark .btn-outline { background: transparent; color: #93c5fd; border-color: #334155; }
.theme-dark .btn-outline:hover { background: #334155; }
.theme-dark .field { background: #0f172a; border-color: #334155; color: #e5e7eb; }
</style>
<script type="importmap">{"imports":{"react":"https://esm.sh/react@19.2.0","react-dom/client":"https://esm.sh/react-dom@19.2.0/client?external=react"}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import React from "react";
import { createRoot } from "react-dom/client";
import { createContext, useContext, useState } from "react";

const AuthContext = createContext(null);

function Avatar() {
  const { user } = useContext(AuthContext);
  return <span className="avatar">{user.name[0]}</span>;
}

function UserMenu() {
  const { user, login, logout } = useContext(AuthContext);

  if (!user) {
    return (
      <button type="button" className="btn btn-primary btn-small" onClick={login}>
        로그인
      </button>
    );
  }

  return (
    <div className="user-menu">
      <Avatar />
      <span>{user.name}</span>
      <button type="button" className="btn btn-outline btn-small" onClick={logout}>
        로그아웃
      </button>
    </div>
  );
}

function Header() {
  return (
    <header className="app-header">
      <strong>My Blog</strong>
      <UserMenu />
    </header>
  );
}

function Greeting() {
  const { user } = useContext(AuthContext);

  return (
    <div className="card">
      <h2>{user ? `${user.name}님, 환영합니다` : "로그인이 필요합니다"}</h2>
      <div className="card-body">
        <p>{user ? "오늘의 글을 확인해 보세요." : "위쪽의 로그인 버튼을 눌러 주세요."}</p>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);

  function login() {
    setUser({ name: "민준" });
  }

  function logout() {
    setUser(null);
  }

  return (
    <AuthContext value={{ user, login, logout }}>
      <div className="screen">
        <Header />
        <Greeting />
      </div>
    </AuthContext>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
