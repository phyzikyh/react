<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>좋아요 수 세기</title>
<style>
  body { margin:0; padding:16px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; }
  button { font-size:15px; padding:8px 16px; border:1px solid #cfd4da; border-radius:8px; background:#fff; cursor:pointer; }
  button:hover { background:#f5f6f7; }
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function LikeButton() {
  const [likes, setLikes] = useState(0);
  function handleClick() { setLikes(likes + 1); }
  return <button onClick={handleClick}>좋아요 {likes}</button>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<LikeButton />);
</script></body></html>
