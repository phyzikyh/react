<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>좋아요 요약</title>
<style>
  body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#262626;}
  h1{font-size:18px;margin:0 0 6px;}
  p.summary{font-size:14px;font-weight:600;margin:0 0 12px;}
  article{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:440px;padding:10px 12px;margin-bottom:8px;border:1px solid #e1e4e8;border-radius:8px;font-size:14px;}
  button{font-size:13px;padding:6px 10px;border:1px solid #cfd4da;border-radius:8px;background:#fff;cursor:pointer;white-space:nowrap;}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

const posts = [
  { id: "p1", username: "minjun_dev", caption: "오늘은 React를 공부했습니다." },
  { id: "p2", username: "coding_kim", caption: "배열 데이터를 화면에 표시합니다." },
  { id: "p3", username: "web_lee", caption: "React 프로젝트를 완성했습니다." },
];

function PostCard({ post, liked, onToggleLike }) {
  return (
    <article>
      <span><strong>{post.username}</strong> {post.caption}</span>
      <button type="button" onClick={() => onToggleLike(post.id)}>
        {liked ? "♥ 좋아요 취소" : "♡ 좋아요"}
      </button>
    </article>
  );
}

function App() {
  const [likedIds, setLikedIds] = useState([]);

  function toggleLike(postId) {
    setLikedIds((previous) =>
      previous.includes(postId)
        ? previous.filter((id) => id !== postId)
        : [...previous, postId]
    );
  }

  return (
    <main>
      <h1>게시물</h1>
      <p className="summary">좋아요한 게시물 {likedIds.length}개</p>
      {posts.map((post) => (
        <PostCard
          key={post.id}
          post={post}
          liked={likedIds.includes(post.id)}
          onToggleLike={toggleLike}
        />
      ))}
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
