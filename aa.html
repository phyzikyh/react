<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    a:link    { color: #0969da; }   /* 방문 전 */
    a:visited { color: #8250df; }   /* 방문 후 */
    a:hover   { color: #0550ae; }   /* 마우스 올림 */
    a:active  { color: #cf222e; }   /* 누르는 순간 */

    .project-card { border: 1px solid #d0d7de; padding: 8px; }
    .project-card:hover { border-color: #0969da; }

    a:focus-visible, button:focus-visible {
      outline: 3px solid #ffbf47;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <p><a href="https://example.com">링크에 마우스를 올려 보세요</a></p>
  <p class="project-card">카드에 마우스를 올리면 테두리 색이 바뀝니다</p>
  <p><button>Tab 키로 이동해 보세요</button></p>
</body>
</html>
