<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>주문서 종합</title>
<style>
  body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#262626;}
  form{display:grid;gap:6px;max-width:340px;margin-bottom:14px;}
  label{font-size:13px;font-weight:600;margin-top:4px;}
  .inline{font-weight:400;}
  input[type="text"],select{font-size:14px;padding:8px 10px;border:1px solid #cfd4da;border-radius:8px;}
  input[aria-invalid="true"]{border-color:#d93025;}
  .error{color:#d93025;font-size:12px;margin:0;}
  button{font-size:14px;padding:8px 14px;border:none;border-radius:8px;background:#0095f6;color:#fff;cursor:pointer;margin-top:8px;}
  ul{list-style:none;padding:0;margin:0;max-width:340px;}
  li{padding:10px 12px;margin-bottom:8px;border:1px solid #e1e4e8;border-radius:8px;font-size:14px;}
  .empty{color:#8e8e8e;font-size:14px;}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
const emptyForm = { name: "", menu: "americano", takeout: false };
const menuNames = { americano: "아메리카노", latte: "라떼", tea: "차" };

function App() {
  const [form, setForm] = useState({ ...emptyForm });
  const [errors, setErrors] = useState({});
  const [orders, setOrders] = useState([]);

  function handleChange(event) {
    const { name, type, value, checked } = event.target;
    setForm((previous) => ({ ...previous, [name]: type === "checkbox" ? checked : value }));
    setErrors((previous) => ({ ...previous, [name]: "" }));
  }

  function handleSubmit(event) {
    event.preventDefault();
    const name = form.name.trim();
    const nextErrors = {};
    if (name.length < 2) nextErrors.name = "이름을 2자 이상 입력하세요.";
    setErrors(nextErrors);
    if (Object.keys(nextErrors).length > 0) return;

    const newOrder = { id: crypto.randomUUID(), name, menu: form.menu, takeout: form.takeout };
    setOrders((previous) => [...previous, newOrder]);
    setForm({ ...emptyForm });
  }

  return (
    <div>
      <form onSubmit={handleSubmit} noValidate>
        <label htmlFor="name">주문자 이름</label>
        <input id="name" name="name" type="text" value={form.name} onChange={handleChange} aria-invalid={Boolean(errors.name)} />
        {errors.name && <p className="error" role="alert">{errors.name}</p>}

        <label htmlFor="menu">메뉴</label>
        <select id="menu" name="menu" value={form.menu} onChange={handleChange}>
          <option value="americano">아메리카노</option>
          <option value="latte">라떼</option>
          <option value="tea">차</option>
        </select>

        <label className="inline"><input name="takeout" type="checkbox" checked={form.takeout} onChange={handleChange} /> 포장</label>

        <button type="submit">주문하기</button>
      </form>

      <h3>주문 내역 {orders.length}건</h3>
      {orders.length === 0 ? (
        <p className="empty">아직 주문이 없습니다.</p>
      ) : (
        <ul>
          {orders.map((order) => (
            <li key={order.id}>{order.name} · {menuNames[order.menu]} · {order.takeout ? "포장" : "매장"}</li>
          ))}
        </ul>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
