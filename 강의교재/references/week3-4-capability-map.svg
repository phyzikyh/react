<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="34" font-size="21" font-weight="800" fill="#172033">지금 배운 것으로 인스타그램 피드에서 만들 수 있는 부분</text>
  <text x="40" y="58" font-size="13" fill="#666">컴포넌트와 Props로 화면 구조와 데이터 표시까지 완성합니다. 눌러서 반응하는 동작은 화면만 준비합니다.</text>

  <!-- ===== Phone mockup ===== -->
  <rect x="40" y="78" width="340" height="452" rx="18" fill="#ffffff" stroke="#c9ccd1" stroke-width="2"/>

  <!-- Header -->
  <rect x="52" y="90" width="316" height="40" rx="6" fill="#fafafa" stroke="#eee"/>
  <text x="68" y="116" font-size="17" font-weight="800" fill="#172033">Fastagram</text>
  <circle cx="356" cy="110" r="12" fill="#1a9e5f"/><text x="356" y="115" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <!-- Story bar -->
  <g>
    <circle cx="80" cy="164" r="20" fill="#f2f2f2" stroke="#e06a2b" stroke-width="2.5"/>
    <circle cx="132" cy="164" r="20" fill="#f2f2f2" stroke="#e06a2b" stroke-width="2.5"/>
    <circle cx="184" cy="164" r="20" fill="#f2f2f2" stroke="#e06a2b" stroke-width="2.5"/>
    <circle cx="236" cy="164" r="20" fill="#f2f2f2" stroke="#e06a2b" stroke-width="2.5"/>
    <circle cx="288" cy="164" r="20" fill="#f2f2f2" stroke="#e06a2b" stroke-width="2.5"/>
  </g>
  <circle cx="356" cy="164" r="12" fill="#1a9e5f"/><text x="356" y="169" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <!-- Post header -->
  <line x1="52" y1="196" x2="368" y2="196" stroke="#eee"/>
  <circle cx="74" cy="216" r="13" fill="#f2f2f2" stroke="#ccc"/>
  <text x="96" y="221" font-size="14" font-weight="700" fill="#172033">minji_dev</text>
  <circle cx="356" cy="216" r="12" fill="#1a9e5f"/><text x="356" y="221" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <!-- Image -->
  <rect x="52" y="238" width="316" height="150" fill="#eef1f4"/>
  <text x="210" y="318" font-size="13" fill="#9aa3ad" text-anchor="middle">사진</text>
  <circle cx="356" cy="252" r="12" fill="#1a9e5f"/><text x="356" y="257" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>

  <!-- Action row: like heart (outline) -->
  <path d="M74,410 C66,401 66,392 74,394 C82,392 82,401 74,410 Z" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="98" y="396" width="16" height="14" rx="3" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M300,394 l14,0 0,18 -7,-5 -7,5 z" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="356" cy="402" r="12" fill="#e08a1e"/><text x="356" y="407" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>

  <!-- Likes -->
  <text x="54" y="438" font-size="13" font-weight="700" fill="#172033">좋아요 128개</text>
  <circle cx="356" cy="433" r="12" fill="#1a9e5f"/><text x="356" y="438" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>

  <!-- Caption -->
  <text x="54" y="462" font-size="13" fill="#172033"><tspan font-weight="700">minji_dev</tspan> 오늘 React 배움</text>
  <circle cx="356" cy="458" r="12" fill="#1a9e5f"/><text x="356" y="463" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>

  <!-- Comment input -->
  <rect x="52" y="480" width="316" height="34" rx="17" fill="#fff" stroke="#ddd"/>
  <text x="68" y="501" font-size="12" fill="#9aa3ad">댓글 달기…</text>
  <text x="336" y="501" font-size="12" font-weight="700" fill="#c7c9cc" text-anchor="end">게시</text>
  <circle cx="356" cy="463" r="0" fill="none"/>
  <circle cx="24" cy="497" r="12" fill="#e08a1e"/><text x="24" y="502" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text>

  <!-- ===== Right legend ===== -->
  <g font-size="14">
    <text x="430" y="104" font-size="15" font-weight="800" fill="#172033">번호별로 무엇을 만드는가</text>

    <!-- item template -->
    <g transform="translate(430,128)">
      <circle cx="13" cy="13" r="13" fill="#1a9e5f"/><text x="13" y="18" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="36" y="12" font-weight="700" fill="#172033">로고 헤더</text>
      <text x="36" y="30" font-size="12" fill="#1a7a4a">컴포넌트로 만들기 · 지금 가능</text>
    </g>
    <g transform="translate(430,176)">
      <circle cx="13" cy="13" r="13" fill="#1a9e5f"/><text x="13" y="18" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="36" y="12" font-weight="700" fill="#172033">스토리 줄</text>
      <text x="36" y="30" font-size="12" fill="#1a7a4a">같은 부품 여러 개 배치 · 지금 가능</text>
    </g>
    <g transform="translate(430,224)">
      <circle cx="13" cy="13" r="13" fill="#1a9e5f"/><text x="13" y="18" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <text x="36" y="12" font-weight="700" fill="#172033">사용자명 · 아바타</text>
      <text x="36" y="30" font-size="12" fill="#1a7a4a">Props로 데이터 표시 · 지금 가능</text>
    </g>
    <g transform="translate(430,272)">
      <circle cx="13" cy="13" r="13" fill="#1a9e5f"/><text x="13" y="18" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="36" y="12" font-weight="700" fill="#172033">사진</text>
      <text x="36" y="30" font-size="12" fill="#1a7a4a">Props(imageUrl)로 표시 · 지금 가능</text>
    </g>
    <g transform="translate(430,320)">
      <circle cx="13" cy="13" r="13" fill="#1a9e5f"/><text x="13" y="18" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
      <text x="36" y="12" font-weight="700" fill="#172033">좋아요 수 · 캡션 (6·7)</text>
      <text x="36" y="30" font-size="12" fill="#1a7a4a">Props로 숫자·문구 표시 · 지금 가능</text>
    </g>

    <line x1="430" y1="372" x2="880" y2="372" stroke="#eee"/>

    <g transform="translate(430,388)">
      <circle cx="13" cy="13" r="13" fill="#e08a1e"/><text x="13" y="18" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <text x="36" y="12" font-weight="700" fill="#172033">좋아요 하트 누르기</text>
      <text x="36" y="30" font-size="12" fill="#b06a12">화면만 만들 수 있음 · 누르면 바뀌는 동작은 아직</text>
    </g>
    <g transform="translate(430,436)">
      <circle cx="13" cy="13" r="13" fill="#e08a1e"/><text x="13" y="18" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text>
      <text x="36" y="12" font-weight="700" fill="#172033">댓글 입력 · 검색</text>
      <text x="36" y="30" font-size="12" fill="#b06a12">화면만 만들 수 있음 · 입력 반영은 아직</text>
    </g>
  </g>

  <!-- Legend key -->
  <g transform="translate(430,486)" font-size="12.5">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#1a9e5f"/>
    <text x="22" y="12" fill="#444">지금 만들 수 있음(구조·컴포넌트·데이터 표시)</text>
    <rect x="0" y="24" width="14" height="14" rx="3" fill="#e08a1e"/>
    <text x="22" y="36" fill="#444">화면만 만들 수 있음(누르면 반응하는 동작은 아직)</text>
  </g>
</svg>
