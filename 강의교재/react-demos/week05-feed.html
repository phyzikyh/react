<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>반응하는 게시물 피드</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#fafafa; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; color:#262626; }
  .feed { max-width:420px; margin:0 auto; padding:14px; }
  .post { background:#fff; border:1px solid #dbdbdb; border-radius:10px; margin-bottom:16px; }
  .post__head { padding:10px 12px; }
  .post__user { font-weight:600; font-size:14px; }
  .post__image { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .post__actions { padding:8px 12px 0; }
  .post__actions button { font-size:22px; background:none; border:none; cursor:pointer; }
  .post__likes { font-weight:600; font-size:14px; padding:4px 12px; }
  .post__caption { font-size:14px; padding:2px 12px; }
  .post input { width:calc(100% - 24px); margin:8px 12px; padding:6px 0; border:none; border-top:1px solid #efefef; outline:none; font-size:14px; }
  .post__preview { font-size:13px; color:#737373; padding:0 12px 12px; }
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function PostCard({ username, image, initialLikes, caption }) {
  const [liked, setLiked] = useState(false);
  const [likes, setLikes] = useState(initialLikes);
  const [comment, setComment] = useState("");
  function toggleLike() {
    setLiked(!liked);
    setLikes(liked ? likes - 1 : likes + 1);
  }
  return (
    <article className="post">
      <header className="post__head"><span className="post__user">{username}</span></header>
      <img className="post__image" src={image} alt={`${username}의 게시물`} />
      <div className="post__actions"><button onClick={toggleLike}>{liked ? "♥" : "♡"}</button></div>
      <p className="post__likes">좋아요 {likes.toLocaleString()}개</p>
      <p className="post__caption"><b>{username}</b> {caption}</p>
      <input value={comment} onChange={(event) => setComment(event.target.value)} placeholder="댓글 달기..." />
      {comment && <p className="post__preview">작성 중: {comment}</p>}
    </article>
  );
}
function App() {
  return (
    <div className="feed">
      <PostCard username="minjun_dev" image="https://picsum.photos/seed/react1/470/470" initialLikes={1284} caption="React State 배우는 중" />
      <PostCard username="coding_kim" image="https://picsum.photos/seed/react2/470/470" initialLikes={356} caption="좋아요가 진짜 눌린다" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
