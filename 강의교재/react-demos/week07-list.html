<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>게시물 배열을 카드 목록으로 바꾸기</title>
    <style>
      body { margin: 0; padding: 14px; background: #fafafa; color: #262626; font-family: Arial, sans-serif; }
      main { max-width: 460px; margin: 0 auto; }
      .post-card { margin: 10px 0; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; background: white; }
      h1 { font-size: 20px; }
      h3, p { margin: 4px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script type="text/babel">
      const posts = [
        { id: "p1", username: "minjun_dev", caption: "오늘은 React를 공부했습니다." },
        { id: "p2", username: "coding_kim", caption: "배열 데이터를 화면에 표시합니다." },
        { id: "p3", username: "web_lee", caption: "반복되는 카드를 재사용합니다." },
      ];

      function PostCard({ post }) {
        return (
          <article className="post-card">
            <h3>{post.username}</h3>
            <p>{post.caption}</p>
          </article>
        );
      }

      function App() {
        return (
          <main>
            <h1>게시물</h1>
            <section>
              {posts.map((post) => (
                <PostCard key={post.id} post={post} />
              ))}
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
