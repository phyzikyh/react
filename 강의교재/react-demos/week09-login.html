<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>로그인 폼</title>
<style>
  body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#262626;}
  form{display:grid;gap:8px;max-width:300px;}
  label{font-size:13px;font-weight:600;}
  input{font-size:14px;padding:8px 10px;border:1px solid #cfd4da;border-radius:8px;}
  button{font-size:14px;padding:8px 14px;border:none;border-radius:8px;background:#0095f6;color:#fff;cursor:pointer;margin-top:4px;}
  p{font-size:14px;margin:10px 0 0;}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function App() {
  const [form, setForm] = useState({ userId: "", password: "" });
  const [message, setMessage] = useState("");

  function handleChange(event) {
    const { name, value } = event.target;
    setForm((previous) => ({ ...previous, [name]: value }));
  }

  function handleSubmit(event) {
    event.preventDefault();
    setMessage(`${form.userId}님, 로그인 정보를 확인했습니다.`);
  }

  return (
    <div>
      <form onSubmit={handleSubmit}>
        <label htmlFor="userId">아이디</label>
        <input id="userId" name="userId" value={form.userId} onChange={handleChange} />
        <label htmlFor="password">비밀번호</label>
        <input id="password" name="password" type="password" value={form.password} onChange={handleChange} />
        <button type="submit">로그인</button>
      </form>
      {message && <p>{message}</p>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
