<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>데이터 불러오기와 시계</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#fafafa; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; color:#262626; }
  .feed { max-width:420px; margin:0 auto; padding:14px; }
  .feed-header { display:flex; justify-content:space-between; align-items:baseline; padding:10px 12px; background:#fff; border:1px solid #dbdbdb; border-radius:10px; margin-bottom:12px; }
  .feed-logo { font-size:20px; font-weight:700; }
  .feed-clock { font-size:13px; color:#737373; font-variant-numeric:tabular-nums; }
  .post { background:#fff; border:1px solid #dbdbdb; border-radius:10px; }
  .post__head { padding:10px 12px; font-weight:600; font-size:14px; }
  .post__image { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .post__caption { font-size:14px; padding:8px 12px 12px; }
  .loading { text-align:center; color:#8e8e8e; padding:40px 0; }
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function HeaderClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return <span className="feed-clock">{now.toLocaleTimeString("ko-KR")}</span>;
}

function App() {
  const [post, setPost] = useState(null);
  useEffect(() => {
    const id = setTimeout(() => {
      setPost({
        username: "minjun_dev",
        image: "https://picsum.photos/seed/react6/470/470",
        caption: "데이터를 불러와 채운 게시물",
      });
    }, 1200);
    return () => clearTimeout(id);
  }, []);

  return (
    <div className="feed">
      <div className="feed-header">
        <span className="feed-logo">Fastagram</span>
        <HeaderClock />
      </div>
      {post === null ? (
        <p className="loading">불러오는 중…</p>
      ) : (
        <article className="post">
          <div className="post__head">{post.username}</div>
          <img className="post__image" src={post.image} alt={`${post.username}의 게시물`} />
          <p className="post__caption"><b>{post.username}</b> {post.caption}</p>
        </article>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
