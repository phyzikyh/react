<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>검색창 제출</title>
<style>
  body{margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#262626;}
  form{display:flex;gap:8px;margin-bottom:12px;}
  input{flex:1;font-size:14px;padding:8px 10px;border:1px solid #cfd4da;border-radius:8px;}
  button{font-size:14px;padding:8px 14px;border:1px solid #cfd4da;border-radius:8px;background:#fff;cursor:pointer;}
  p{font-size:14px;margin:6px 0;}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;
function App() {
  const [query, setQuery] = useState("");
  const [submittedQuery, setSubmittedQuery] = useState("");

  function handleSubmit(event) {
    event.preventDefault();
    setSubmittedQuery(query.trim());
  }

  return (
    <div>
      <form onSubmit={handleSubmit}>
        <label htmlFor="search" hidden>검색어</label>
        <input id="search" value={query} onChange={(event) => setQuery(event.target.value)} placeholder="검색어를 입력하세요" />
        <button type="submit">검색</button>
      </form>
      <p>입력 중: {query}</p>
      {submittedQuery && <p>검색한 단어: {submittedQuery}</p>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
