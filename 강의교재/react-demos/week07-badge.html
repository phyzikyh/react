<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>조건이 참일 때만 배지 표시하기</title>
    <style>
      body { margin: 0; padding: 16px; background: #fafafa; color: #262626; font-family: Arial, sans-serif; }
      main { display: grid; gap: 10px; max-width: 420px; }
      article { padding: 14px; border: 1px solid #ddd; border-radius: 8px; background: white; }
      .badge { margin-left: 6px; padding: 3px 7px; border-radius: 5px; background: #087e8b; color: white; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script type="text/babel">
      function FeaturedBadge({ featured }) {
        return (
          <article>
            <strong>이번 주 인기 게시물</strong>
            {featured && <span className="badge">추천</span>}
          </article>
        );
      }

      function App() {
        return (
          <main>
            <FeaturedBadge featured={true} />
            <FeaturedBadge featured={false} />
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
