<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CSS가 적용된 반응형 포트폴리오 예제" />
    <title>CSS 포트폴리오 실행 결과</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#top">홍길동.dev</a>
      <nav aria-label="주요 메뉴">
        <ul>
          <li><a href="#about">소개</a></li>
          <li><a href="#skills">기술</a></li>
          <li><a href="#projects">프로젝트</a></li>
        </ul>
      </nav>
    </header>

    <main id="top">
      <section class="hero" id="about">
        <div>
          <p class="eyebrow">Frontend Developer</p>
          <h1>사용하기 편한 웹을 만드는 홍길동입니다.</h1>
          <p>HTML의 의미 있는 구조 위에 반응형 CSS 디자인을 적용합니다.</p>
          <a class="button" href="#projects">프로젝트 보기</a>
        </div>
        <div class="avatar" aria-label="홍길동 프로필 자리 표시자">HG</div>
      </section>

      <section id="skills">
        <h2>사용 기술</h2>
        <ul class="badges">
          <li>HTML</li><li>CSS</li><li>JavaScript</li><li>React</li>
        </ul>
      </section>

      <section id="projects">
        <h2>프로젝트</h2>
        <div class="project-grid">
          <article class="card">
            <span>완료</span>
            <h3>개인 포트폴리오</h3>
            <p>개발 과정과 결과물을 소개하는 반응형 웹사이트입니다.</p>
          </article>
          <article class="card">
            <span>기획 중</span>
            <h3>React 학기 프로젝트</h3>
            <p>15주 동안 React 기능을 누적하여 완성합니다.</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
